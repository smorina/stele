[project]
name = "stele"
version = "0.1.0"
description = "PDF -> photomask (GDSII) archive compiler for long-horizon information preservation (US 11,993,421 B2 style pseudopage plates)"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "gdstk>=0.9.55",
    "pymupdf>=1.24",
    "pypdfium2>=4.30",
    "opencv-python-headless>=4.10",
    "shapely>=2.0",
    "numpy>=1.26",
    "pillow>=10.3",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "klayout>=0.29",
]

[project.scripts]
stele = "stele.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stele"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running builds (nightly tier)",
]
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
